<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>名片歸檔｜第4堂課</title>
  <style>
    :root { --bg:#edf1f5; --panel:#fff; --ink:#172033; --muted:#6d7788; --line:#dbe1e8; --navy:#253854; --pink:#d75484; --pink-soft:#fdeaf1; --shadow:0 16px 40px rgba(37,56,84,.10); }
    * { box-sizing:border-box; }
    body { margin:0; color:var(--ink); background:linear-gradient(135deg,#eef2f6 0%,#e4e9ef 100%); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif; }
    .app { max-width:1440px; margin:0 auto; padding:30px 24px 48px; }
    header { display:flex; align-items:flex-end; justify-content:space-between; gap:24px; margin-bottom:24px; }
    .eyebrow { color:var(--pink); font-size:13px; font-weight:800; letter-spacing:.12em; margin-bottom:8px; }
    h1 { margin:0; color:var(--navy); font-size:clamp(28px,4vw,48px); letter-spacing:-.04em; }
    .subtitle { color:var(--muted); margin:10px 0 0; }
    .privacy { background:var(--panel); border:1px solid var(--line); border-radius:999px; padding:10px 14px; color:var(--muted); font-size:13px; white-space:nowrap; }
    .summary { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:14px; margin-bottom:18px; }
    .metric { background:var(--panel); border:1px solid var(--line); border-radius:18px; padding:17px 18px; box-shadow:var(--shadow); }
    .metric .label { color:var(--muted); font-size:13px; }
    .metric .value { color:var(--navy); font-size:28px; font-weight:800; margin-top:4px; }
    .workspace { display:grid; grid-template-columns:minmax(0,1.2fr) minmax(330px,.8fr); gap:18px; align-items:start; }
    .panel { background:rgba(255,255,255,.94); border:1px solid var(--line); border-radius:22px; box-shadow:var(--shadow); }
    .toolbar { padding:16px; display:flex; flex-wrap:wrap; gap:10px; border-bottom:1px solid var(--line); }
    input, select { border:1px solid var(--line); background:#fbfcfd; color:var(--ink); border-radius:12px; padding:12px 14px; font:inherit; outline:none; }
    input { flex:1 1 260px; min-width:220px; }
    input:focus, select:focus { border-color:var(--pink); box-shadow:0 0 0 3px var(--pink-soft); }
    .results { color:var(--muted); font-size:13px; padding:0 16px 14px; }
    .cards { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; padding:0 16px 16px; }
    .card { text-align:left; border:1px solid var(--line); border-radius:16px; padding:15px; background:#fff; cursor:pointer; transition:.18s ease; }
    .card:hover, .card.active { border-color:var(--pink); transform:translateY(-2px); box-shadow:0 10px 22px rgba(215,84,132,.14); }
    .card-top { display:flex; justify-content:space-between; gap:10px; align-items:flex-start; }
    .card h3 { margin:0; font-size:19px; color:var(--navy); }
    .role { color:var(--muted); font-size:13px; margin-top:4px; }
    .tag { background:var(--pink-soft); color:#a83764; border-radius:999px; font-size:12px; padding:5px 9px; white-space:nowrap; }
    .company { margin:13px 0 8px; font-weight:700; line-height:1.5; }
    .contact-line { color:var(--muted); font-size:13px; line-height:1.6; overflow-wrap:anywhere; }
    .detail { position:sticky; top:18px; overflow:hidden; }
    .detail-head { padding:20px 20px 16px; background:var(--navy); color:white; }
    .detail-head .tag { display:inline-block; background:rgba(255,255,255,.16); color:#fff; margin-bottom:12px; }
    .detail-head h2 { margin:0; font-size:28px; }
    .detail-head p { margin:6px 0 0; color:#dce6f2; }
    .detail-body { padding:18px 20px 20px; }
    .photo { width:100%; aspect-ratio:1.6; object-fit:contain; background:#f1f3f5; border:1px solid var(--line); border-radius:14px; cursor:zoom-in; }
    .fields { display:grid; gap:12px; margin-top:18px; }
    .field { display:grid; grid-template-columns:90px 1fr; gap:12px; line-height:1.55; font-size:14px; }
    .field b { color:var(--muted); font-weight:600; }
    .field a { color:#b53c6d; overflow-wrap:anywhere; }
    .note { margin-top:16px; padding:12px 14px; border-radius:12px; background:#fff8e6; color:#73551b; font-size:13px; line-height:1.6; }
    .empty { grid-column:1/-1; text-align:center; color:var(--muted); padding:42px 12px; }
    .modal { display:none; position:fixed; inset:0; z-index:5; background:rgba(13,22,35,.82); place-items:center; padding:24px; }
    .modal.open { display:grid; }
    .modal img { max-width:min(1100px,94vw); max-height:88vh; object-fit:contain; border-radius:14px; box-shadow:0 20px 60px #0008; }
    .close { position:fixed; top:18px; right:22px; border:0; background:#fff; color:var(--navy); border-radius:50%; width:42px; height:42px; font-size:24px; cursor:pointer; }
    @media (max-width:900px) { .workspace { grid-template-columns:1fr; } .detail { position:static; } .summary { grid-template-columns:repeat(2,minmax(0,1fr)); } }
    @media (max-width:560px) { .app { padding:22px 14px 36px; } header { display:block; } .privacy { display:inline-block; margin-top:14px; } .cards { grid-template-columns:1fr; } .summary { gap:9px; } .metric { padding:13px; } .metric .value { font-size:24px; } }
  </style>
</head>

    function renderList(){
      const list=filtered(); $('#results').textContent=`顯示 ${list.length} / ${cards.length} 張名片`;
      $('#cards').innerHTML=list.length?list.map(c=>`<button class="card ${c.id===selected.id?'active':''}" data-id="${c.id}"><div class="card-top"><div><h3>${c.name}</h3><div class="role">${c.role||'未標示職稱'}</div></div><span class="tag">${c.category}</span></div><div class="company">${c.company}</div><div class="contact-line">${c.phone||'未提供電話'}${c.email?' · '+c.email:''}</div></button>`).join(''):'<div class="empty">找不到符合的名片，請換個關鍵字或分類。</div>';
      document.querySelectorAll('.card').forEach(el=>el.addEventListener('click',()=>{selected=cards.find(c=>c.id==el.dataset.id);renderList();renderDetail();}));
    }
    function field(label,value,link){ if(!value)return ''; return `<div class="field"><b>${label}</b><span>${link?`<a href="${link}" target="_blank" rel="noreferrer">${value}</a>`:value}</span></div>`; }
    function renderDetail(){
      const c=selected;
      $('#detail').innerHTML=`<div class="detail-head"><span class="tag">${c.category}</span><h2>${c.name}</h2><p>${c.role||'未標示職稱'}</p></div><div class="detail-body"><img class="photo" src="${imgPath(c)}" alt="${c.name} 的名片" title="點擊放大" /><div class="fields">${field('公司／單位',c.company)}${field('地址',c.address)}${field('電話',c.phone)}${field('傳真',c.fax)}${field('手機',c.mobile)}${field('Email',c.email,`mailto:${c.email}`)}${field('網站',c.website,c.website)}${field('統一編號',c.tax)}</div><div class="note">${c.note}</div></div>`;
      $('.photo').addEventListener('click',()=>{$('#modalImage').src=imgPath(c);$('#modal').classList.add('open');});
    }
    $('#search').addEventListener('input',renderList); $('#category').addEventListener('change',renderList);
    $('#close').addEventListener('click',()=>$('#modal').classList.remove('open')); $('#modal').addEventListener('click',e=>{if(e.target.id==='modal')$('#modal').classList.remove('open')});
    renderSummary(); renderList(); renderDetail();
  </script>
</body>
</html>
